name: Build WalletCore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: "1.6.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WalletCore
          path: bin/*.apk
