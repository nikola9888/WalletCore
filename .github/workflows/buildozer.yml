name: WalletCore APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

    - uses: actions/checkout@v4


    - name: Setup
      run: |
        sudo apt update
        sudo apt install -y \
        python3-pip \
        openjdk-17-jdk \
        git \
        zip \
        unzip


    - name: Java 17
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV


    - name: Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer
        pip install cython==0.29.37

    - name: Clean build cache
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer
        
    - name: Build APK
      run: |
        buildozer android debug


    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: WalletCore
        path: bin/*.apk
