name: WalletCore APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Check environment
      run: |
        python3 --version
        buildozer --version
        java -version


    - name: Accept Android licenses
      run: |
        yes | sdkmanager --licenses || true


    - name: Install Android packages
      run: |
        sdkmanager \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"


    - name: Clean Buildozer
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer
        rm -rf bin


    - name: Build APK
      run: |
        buildozer -v android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: WalletCore-debug-apk

        path: bin/*.apk
