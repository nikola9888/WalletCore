name: WalletCore APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROIDAPI: 35
      ANDROIDMINAPI: 24


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Install Android SDK packages
      run: |

        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "ndk;25.2.9519653"


    - name: Install Python tools
      run: |

        python -m pip install --upgrade pip

        pip install buildozer==1.6.0
        pip install cython==0.29.36


    - name: Configure Buildozer environment
      run: |

        echo "ANDROIDSDK=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROIDNDK=$ANDROID_NDK_HOME" >> $GITHUB_ENV

        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROIDSDK=$ANDROID_HOME"

        ls $ANDROID_HOME/build-tools
        ls $ANDROID_HOME/platforms


    - name: Clean
      run: |

        rm -rf ~/.buildozer
        rm -rf .buildozer
        rm -rf bin

    - name: Fix sdkmanager path for Buildozer
      run: |
        mkdir -p /usr/local/lib/android/sdk/tools/bin
        ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
          /usr/local/lib/android/sdk/tools/bin/sdkmanager

        chmod +x /usr/local/lib/android/sdk/tools/bin/sdkmanager
 
        ls -l /usr/local/lib/android/sdk/tools/bin


    - name: Build APK
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer
        buildozer -v android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: WalletCore-debug

        path: bin/*.apk
