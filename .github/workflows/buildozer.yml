name: WalletCore APK

on:
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Environment
      run: |
        python3 --version
        buildozer --version
        java -version


    - name: Clean
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer
        rm -rf bin


    - name: Build APK
      env:
        P4A_RELEASE_KEYSTORE: ""
      run: |
        yes | buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: WalletCore-debug

        path: bin/*.apk
