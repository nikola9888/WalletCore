name: Build WalletCore APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36


      - name: Prepare Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/platform-tools
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses

          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          ln -sf $ANDROID_HOME/platform-tools/adb \
          ~/.buildozer/android/platform/android-sdk/platform-tools/adb


      - name: Accept Android licenses
        run: |
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
          > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

          echo "84831b9409646a918e30573bab4c9c91346d8abd" \
          >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true


      - name: Install Android packages
        run: |
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "build-tools;37.0.0"


      - name: Build APK
        run: |
          buildozer android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WalletCore-debug-apk
          path: bin/*.apk
