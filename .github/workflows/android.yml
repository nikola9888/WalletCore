name: Build WalletCore APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install system packages
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config


    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.6.0
        pip install cython==0.29.36


    - name: Android SDK setup
      run: |

        echo "ANDROID_HOME=$ANDROID_HOME"

        SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager | head -n 1)

        echo "sdkmanager:"
        echo $SDKMANAGER

        yes | $SDKMANAGER --licenses || true

        $SDKMANAGER \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0"


    - name: Build APK
      run: |
        buildozer android clean
        buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WalletCore-debug
        path: bin/*.apk
