name: Build WalletCore APK

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install system packages
      run: |

        sudo apt update

        sudo apt install -y \
        git \
        zip \
        unzip \
        openjdk-17-jdk \
        autoconf \
        libtool \
        pkg-config \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        cmake


    - name: Install Android SDK
      uses: android-actions/setup-android@v3


    - name: Accept licenses
      run: |

        yes | sdkmanager --licenses || true


    - name: Install SDK packages
      run: |

        sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0" \
        "ndk;27.3.13750724"


    - name: Install Python tools
      run: |

        python -m pip install --upgrade pip

        pip install \
        buildozer==1.6.0 \
        cython==0.29.36 \
        appdirs \
        virtualenv


    - name: Install p4a
      run: |

        pip install python-for-android


    - name: Clean build
      run: |

        rm -rf .buildozer


    - name: Build APK
      run: |

        buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: WalletCore-debug

        path: bin/*.apk
