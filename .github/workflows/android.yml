name: Build WalletCore APK

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          build-essential \
          autoconf \
          libtool \
          pkg-config


    - name: Install Buildozer
      run: |

        python -m pip install --upgrade pip

        pip install buildozer==1.6.0

        pip install cython==0.29.36


    - name: Accept Android licenses
      run: |

        mkdir -p $ANDROID_HOME/licenses

        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
        > $ANDROID_HOME/licenses/android-sdk-license

        echo "84831b9409646a918e30573bab4c9c91346d8abd" \
        >> $ANDROID_HOME/licenses/android-sdk-license


        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true


    - name: Install Android SDK packages
      run: |

        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"


    - name: Link Android SDK for Buildozer
      run: |

        rm -rf ~/.buildozer/android/platform/android-sdk

        mkdir -p ~/.buildozer/android/platform

        ln -s $ANDROID_HOME \
        ~/.buildozer/android/platform/android-sdk


    - name: Clean Buildozer cache
      run: |

        rm -rf .buildozer


    - name: Build APK
      run: |

        buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4

      with:

        name: WalletCore-debug-apk

        path: bin/*.apk
