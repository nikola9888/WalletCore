name: Build WalletCore APK

on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"



    - name: Install Linux packages
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config



    - name: Install Buildozer dependencies
      run: |

        python -m pip install --upgrade pip


        pip install buildozer==1.6.0


        pip install cython==0.29.36


        pip install \
          appdirs \
          colorama \
          jinja2 \
          six \
          sh \
          pep517 \
          pytoml \
          virtualenv



    - name: Android SDK
      run: |


        SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager | head -n 1)


        echo "SDKMANAGER=$SDKMANAGER"


        yes | $SDKMANAGER --licenses || true


        $SDKMANAGER \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0"



    - name: Prepare python-for-android
      run: |


        mkdir -p .buildozer/android/platform


        git clone \
        https://github.com/kivy/python-for-android.git \
        .buildozer/android/platform/python-for-android



    - name: Build WalletCore APK
      run: |


        buildozer android clean


        buildozer android debug



    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: WalletCore-debug-apk

        path: bin/*.apk
