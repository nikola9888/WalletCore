name: WalletCore AAB

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install tools
      run: |
        pip install --upgrade pip
        pip install buildozer==1.6.0
        pip install Cython==0.29.37
        pip install sh


    - name: Restore keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > walletcore.keystore


    - name: Verify keystore
      run: |
        keytool -list \
        -keystore walletcore.keystore \
        -storepass WalletCore123!


    - name: Check files
      run: |
        ls -la
        ls -la walletcore.keystore


    - name: Prepare build
      run: |
        chmod -R 777 .


    - name: Build signed AAB
      run: |
        yes | buildozer android release


    - name: Find apksigner
      run: |
        find / -name apksigner 2>/dev/null || true


    - name: Check AAB
      run: |
        ls -la bin/


    - name: Verify AAB signature
      run: |
        APK_SIGNER=$(find / -name apksigner 2>/dev/null | head -n 1)

        if [ -z "$APK_SIGNER" ]; then
          echo "apksigner not found"
          exit 1
        fi

        echo "Using: $APK_SIGNER"

        $APK_SIGNER verify \
        --verbose \
        --print-certs \
        bin/*.aab


    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: WalletCore-release-aab
        path: bin/*.aab
