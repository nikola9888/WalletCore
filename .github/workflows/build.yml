name: WalletCore AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"
      P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/walletcore.keystore
      P4A_RELEASE_KEYALIAS: walletcore
      P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
      P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install current Android build tooling
        run: |
          python -m pip install "buildozer @ git+https://github.com/kivy/buildozer.git"
          python -m pip install "cython==0.29.34" legacy-cgi setuptools
          buildozer --version

      - name: Check signing secrets
        run: |
          test -n "$P4A_RELEASE_KEYSTORE_PASSWD"
          test -n "$P4A_RELEASE_KEYALIAS_PASSWD"

      - name: Restore upload keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > walletcore.keystore
          test -s walletcore.keystore

      - name: Verify upload keystore
        run: |
          keytool -list \
            -keystore walletcore.keystore \
            -storepass "$P4A_RELEASE_KEYSTORE_PASSWD" \
            -alias "$P4A_RELEASE_KEYALIAS"

      - name: Clean build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build signed AAB
        run: |
          yes | buildozer android release

      - name: Verify AAB signature
        run: |
          AAB="$(find bin -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$AAB"
          echo "AAB: $AAB"
          jarsigner -verify -verbose -certs "$AAB"

      - name: Check AAB
        run: |
          AAB="$(find bin -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$AAB"
          ls -lh "$AAB"
          unzip -l "$AAB" | grep 'META-INF/'

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: WalletCore-release-aab
          path: bin/*.aab
          if-no-files-found: error
