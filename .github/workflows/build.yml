name: WalletCore AAB

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install tools
      run: |
        pip install --upgrade pip
        pip install buildozer==1.6.0
        pip install Cython==0.29.37
        pip install sh


    - name: Restore keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > walletcore.keystore


    - name: Verify keystore
      run: |
        keytool -list \
        -keystore walletcore.keystore \
        -storepass WalletCore123!


    - name: Check files
      run: |
        ls -la
        ls -la walletcore.keystore


    - name: Prepare build
      run: |
        chmod -R 777 .

    - name: Clean build
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Build signed AAB
      run: |
        yes | buildozer android release

    - name: Build unsigned AAB
      run: |
        yes | buildozer android release


    - name: Sign AAB manually
      run: |
        jarsigner \
        -verbose \
        -sigalg SHA256withRSA \
        -digestalg SHA-256 \
        -keystore walletcore.keystore \
        -storepass WalletCore123! \
        -keypass WalletCore123! \
        -signedjar bin/walletcore-signed.aab \
        bin/walletcore-1.1.0-arm64-v8a-release.aab \
        walletcore


    - name: Verify signed AAB
      run: |
        jarsigner -verify -verbose -certs bin/walletcore-signed.aab


    - name: Check AAB
      run: |
        ls -lh bin/
        unzip -l bin/walletcore-signed.aab | grep META-INF


    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: WalletCore-release-aab
        path: bin/walletcore-signed.aab
