name: WalletCore APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Prepare permissions
      run: |
        mkdir -p /home/user/.buildozer
        chmod -R 777 /home/user


    - name: Build APK
      run: |
        buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WalletCore-debug
        path: bin/*.apk
