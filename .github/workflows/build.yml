name: WalletCore APK

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    container:
      image: kivy/buildozer:1.5.0

    env:
      ACCEPT_ANDROID_SDK_LICENSE: "yes"

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Prepare build
      run: |
        chmod -R 777 .
        rm -rf .buildozer
        rm -rf bin
        mkdir -p $HOME/.buildozer


    - name: Build APK
      run: |
        yes | buildozer android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WalletCore-debug
        path: bin/*.apk